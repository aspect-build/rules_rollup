name: CI - Vanilla Bazel

# Controls when the action will run
on:
    # Triggers the workflow on push or pull request events but only for the main branch
    push:
        branches: [main]
    pull_request:
        branches: [main]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

permissions:
  id-token: write

jobs:
    # MacOS and Windows smoke tests
    # Only run on main branch (not PRs) to minimize minutes (billed at 10X and 2X respectively)
    # https://docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions#included-storage-and-minutes
    # Linux is tested on Aspect Workflows
    test:
        if: github.ref_name == 'main' || contains(github.head_ref, 'macos') || contains(github.head_ref, 'windows')
        runs-on: ${{ matrix.os }}-latest
        strategy:
            fail-fast: false
            matrix:
                bzlmod: [1, 0]
                os: [macos, windows]
                folder:
                    - '.'
                    - 'e2e/smoke'
                    - 'e2e/smoke_rjs3'
                exclude:
                    # These workspaces are only tested with bzlmod
                    - folder: .
                      bzlmod: 0
                    - folder: e2e/smoke_rjs3
                      bzlmod: 0
        steps:
            - uses: actions/checkout@v6

            - name: Setup Bazel
              uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
              with:
                  bazelisk-cache: true
                  disk-cache: ${{ matrix.bzlmod }}-${{ matrix.os }}-${{ matrix.folder }}
                  repository-cache: true

            # Writes ~/.aspect/bazelrc, enabling Aspect Cloud for `bazel` when there is
            # a credential (not on fork PRs). Windows is not supported by
            # setup-aspect, so it builds without Aspect Cloud.
            - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
              if: matrix.os != 'windows'
              with:
                  aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
                  disk-cache: false
                  repository-cache: false

            # Bazel fails the build rather than create the directory the
            # aspect-exec-log group writes into.
            - run: mkdir -p .aspect/generated
              if: matrix.os != 'windows'
              shell: bash
              working-directory: ${{ matrix.folder }}

            - name: Get Bazel major version
              id: bazel-version
              shell: bash
              run: echo "major=$(head -n 1 .bazelversion | cut -c1)" >> $GITHUB_OUTPUT

            - name: bazel test //...
              working-directory: ${{ matrix.folder }}
              shell: bash
              run: |
                  bazel \
                    --bazelrc=${GITHUB_WORKSPACE//\\/\/}/.github/workflows/ci.bazelrc \
                    test \
                    --test_tag_filters=-skip-on-bazel${{ steps.bazel-version.outputs.major }} \
                    --build_tag_filters=-skip-on-bazel${{ steps.bazel-version.outputs.major }} \
                    --enable_bzlmod=${{ matrix.bzlmod }} \
                    //...
